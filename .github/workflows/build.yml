# Builds on every push/PR; publishes a Release zip on v* tags.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build + render test
        shell: cmd
        run: build.bat

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item out\WindowSweaters.exe dist\
          Copy-Item README.md, LICENSE, NOTICE.md dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath WindowSweaters-${{ github.ref_name }}.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: WindowSweaters-${{ github.ref_name }}.zip
          generate_release_notes: true
