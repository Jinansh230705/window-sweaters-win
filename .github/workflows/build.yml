# Builds on every push/PR. Releases are versioned only: push a v* tag (or
# draft a release on the website) to publish WindowSweaters.exe. There is
# deliberately no rolling "latest" release — refreshing one tag forever
# stacks duplicate changelog entries and reads as a mess.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Fires when a release is created from the GitHub website ("Draft a new
  # release"). Tag pushes alone do NOT cover that path, and without this the
  # website-created release would ship source-code zips only.
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build + render test
        shell: cmd
        run: build.bat

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item out\WindowSweaters.exe dist\
          Copy-Item README.md, LICENSE, NOTICE.md dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

  release:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

      # The release asset is the built exe itself — download, unblock, run.
      # Versioned release: push a v* tag (e.g. v1.0.1), or draft it on the
      # website — both paths build the exe from scratch and attach it, so a
      # tagged release never ships source-code zips only.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowSweaters.exe
          generate_release_notes: true
