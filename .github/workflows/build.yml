# Builds on every push/PR. Every main push refreshes a rolling "latest"
# release; pushing a v* tag additionally publishes a versioned release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Fires when a release is created from the GitHub website ("Draft a new
  # release"). Tag pushes alone do NOT cover that path, and without this the
  # website-created release would ship source-code zips only.
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build + render test
        shell: cmd
        run: build.bat

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item out\WindowSweaters.exe dist\
          Copy-Item README.md, LICENSE, NOTICE.md dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

  release:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindowSweaters-windows
          path: dist/

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath WindowSweaters-${{ github.ref_name }}.zip

      # Rolling release: refreshed after every commit on main, so there is
      # always a downloadable build without cutting a version tag. Published
      # as a full release (not pre-release) so it shows up on the Releases
      # page with the Latest badge.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: false
          files: WindowSweaters-${{ github.ref_name }}.zip
          generate_release_notes: true

      # Versioned release: push a v* tag (e.g. v1.0.0), or draft it on the
      # website — both paths build the exe from scratch and attach the zip,
      # so a tagged release never ships source-code zips only.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: WindowSweaters-${{ github.ref_name }}.zip
          generate_release_notes: true
